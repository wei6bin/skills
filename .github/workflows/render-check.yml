name: render-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - uses: extractions/setup-just@v4
        with:
          just-version: "1"
      - run: just test
      - run: just check
      - run: just lint
      - run: just test-hooks
