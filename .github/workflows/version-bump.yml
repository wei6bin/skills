name: version-bump

# Every merge to main that changes the jidoka family gets a new patch version,
# so installs see a readable version and auto-update still ships each merge.
# A merge that already edits src/VERSION (a hand-made minor or major bump) is
# left alone. The bump commit is pushed with GITHUB_TOKEN, which never
# triggers another workflow run, so this cannot loop.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "jidoka/**"
      - "jidoka-copilot/**"
      - "jidoka-cursor/**"

permissions:
  contents: write

concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - name: Skip when the push already set the version
        id: guard
        run: |
          if git diff --name-only "${{ github.event.before }}" HEAD -- src/VERSION | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Bump patch, render and push
        if: steps.guard.outputs.skip != 'true'
        run: |
          git pull --ff-only origin main
          make bump
          make check
          version=$(cat src/VERSION)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/VERSION .claude-plugin/marketplace.json jidoka-cursor/.cursor-plugin/plugin.json
          git commit -m "jidoka: release $version"
          git push origin HEAD:main
