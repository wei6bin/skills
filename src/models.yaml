# Model routing for the jidoka agents. Edit this file, not the agent files.
#
# tiers: one entry per capability tier, with the concrete model per use.
#   claude  - a Claude Code alias (fable, opus, sonnet, haiku), written into the
#             plugin's agents. Aliases keep the routing symbolic: a user remaps
#             a whole tier on their machine with ANTHROPIC_DEFAULT_<TIER>_MODEL
#             in settings.json env, with no plugin edit.
#   copilot - the model a herdr worker on Copilot CLI runs on (crew.sh passes it
#             as `copilot --model`), written into the worker render.
# roles: what each agent does. An agent's frontmatter names its role; the
#   renderer resolves role -> tier -> model. `effort` is Claude Code's per-agent
#   effort level (low, medium, high, xhigh, max).
# An agent may still pin either model with its own `model:` map; that wins over
# the role. Keep such overrides rare and say why in the agent file.

tiers:
  frontier:
    claude: fable
    copilot: claude-opus-4.8
  strong:
    claude: opus
    copilot: claude-opus-4.8
  standard:
    claude: sonnet
    copilot: claude-sonnet-5
  economy:
    claude: haiku
    copilot: claude-haiku-4.5

roles:
  reasoning:
    tier: frontier
    effort: high
  verification:
    tier: strong
    effort: high
  implementation:
    tier: standard
  exploration:
    tier: standard
